[package]
name = "stable-diffusion-rs"
description = "Diffusion model inference in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["stable-diffusion", "diffusion", "inference", "ml"]
categories = ["computer-vision", "science"]

[dependencies]
sd-tensor.workspace = true
sd-loader.workspace = true
sd-models.workspace = true
sd-sample.workspace = true
thiserror.workspace = true
image.workspace = true

[features]
default = []
# The MLX port, per docs/handoff.md decision (b). Additive: the candle
# pipeline beside it is untouched and remains the default.
mlx = ["sd-tensor/mlx", "sd-models/mlx"]
cuda = ["sd-tensor/cuda", "sd-loader/cuda", "sd-models/cuda", "sd-sample/cuda"]
metal = ["sd-tensor/metal", "sd-loader/metal", "sd-models/metal", "sd-sample/metal"]
# Apple BLAS. Links a system framework — adds no native compilation.
accelerate = ["sd-tensor/accelerate", "sd-loader/accelerate", "sd-models/accelerate", "sd-sample/accelerate"]
