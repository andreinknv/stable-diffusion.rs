[package]
name = "sd-models"
description = "Diffusion model architectures (VAE, CLIP, UNet) for stable-diffusion.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
sd-tensor.workspace = true
sd-loader.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokenizers.workspace = true

[features]
# The MLX port of the models, per docs/handoff.md decision (b).
mlx = ["sd-tensor/mlx"]
default = []

[dev-dependencies]
# The tests derive the slow tokenizer form from the fast one by asking the
# model to save itself. Already in the tree as a normal dependency.
tokenizers.workspace = true
