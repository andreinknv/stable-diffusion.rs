[package]
name = "sd-tensor"
description = "Tensor/compute seam for stable-diffusion.rs. The only crate permitted to name a backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Pure bindings, no C compiled — asks the OS how much memory is free. See
# src/sysmem.rs for why a fixed budget is not enough.
libc = "0.2"
thiserror.workspace = true

[features]
default = []
# The MLX backend, per the decision in docs/handoff.md. Needs `mlx-c` and
# `mlx` on the system; build.rs finds them via MLX_C_PREFIX/MLX_PREFIX or
# Homebrew, and links nothing at all when this feature is off.
mlx = []
