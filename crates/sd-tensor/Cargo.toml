[package]
name = "sd-tensor"
description = "Tensor/compute seam for stable-diffusion.rs. The only crate permitted to depend on candle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
candle-core.workspace = true
# Pure bindings, no C compiled — asks the OS how much memory is free. See
# src/sysmem.rs for why a fixed budget is not enough.
libc = "0.2"
candle-nn.workspace = true
thiserror.workspace = true

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

# Deliberately NOT exposing candle's `mkl` feature.
#
# It pulls `intel-mkl-src`, which publishes no license field at all, and Intel
# MKL itself ships under Intel's proprietary Simplified Software License. This
# project advertises a fully permissive dependency tree; silently pulling
# proprietary code in behind a feature flag would make that claim false.
#
# Users who accept Intel's terms can enable it downstream by depending on
# candle directly. See docs/seam.md.
