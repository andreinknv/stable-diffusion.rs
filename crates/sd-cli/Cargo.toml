[package]
name = "sd-cli"
description = "Command-line interface for stable-diffusion.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# NOT `sd`: that binary name belongs to a widely-installed find & replace tool
# (505k downloads on crates.io). Installing over it would break people's PATH.
[[bin]]
name = "sdrs"
path = "src/main.rs"

# Cargo defaults example targets to `test = false`, so a `#[cfg(test)]` block
# in an example compiles under `cargo test` and then never runs. Declaring the
# target explicitly is what makes these tests real; without it the benchmark's
# guard-rail tests would be silently dead in CI.
[[example]]
name = "backend_bench"
path = "examples/backend_bench.rs"
test = true

# These reach into `sd_tensor::mps` or `sd_tensor::fused`, which only exist
# under `metal`. Without the gate they fail to build under any other feature
# set — including `--features mlx`, where they stopped the whole workspace run
# before a single test had been compiled.
[[example]]
name = "mps_diag"
path = "examples/mps_diag.rs"
required-features = ["metal"]

[[example]]
name = "mps_conv"
path = "examples/mps_conv.rs"
required-features = ["metal"]

[[example]]
name = "cpu_group_norm"
path = "examples/cpu_group_norm.rs"
required-features = ["metal"]

[[example]]
name = "adaln_kernel"
path = "examples/adaln_kernel.rs"
required-features = ["metal"]

[[example]]
name = "geglu_kernel"
path = "examples/geglu_kernel.rs"
required-features = ["metal"]

[[example]]
name = "gelu_tail"
path = "examples/gelu_tail.rs"
required-features = ["metal"]

[[example]]
name = "group_norm_kernel"
path = "examples/group_norm_kernel.rs"
required-features = ["metal"]

[dependencies]
stable-diffusion-rs.workspace = true
sd-tensor.workspace = true
anyhow.workspace = true
image.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
cuda = ["stable-diffusion-rs/cuda", "sd-tensor/cuda"]
metal = ["stable-diffusion-rs/metal", "sd-tensor/metal"]
# The CLI has no MLX-specific code yet; the feature exists so that
# `--workspace --features mlx` resolves for every member rather than silently
# building this one with defaults.
mlx = ["stable-diffusion-rs/mlx", "sd-tensor/mlx"]
accelerate = ["stable-diffusion-rs/accelerate", "sd-tensor/accelerate"]
