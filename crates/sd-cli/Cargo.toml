[package]
name = "sd-cli"
description = "Command-line interface for stable-diffusion.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# NOT `sd`: that binary name belongs to a widely-installed find & replace tool
# (505k downloads on crates.io). Installing over it would break people's PATH.
[[bin]]
name = "sdrs"
path = "src/main.rs"

[dependencies]
stable-diffusion-rs.workspace = true
sd-tensor.workspace = true
anyhow.workspace = true
image.workspace = true
png.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["mlx"]
# MLX is the backend. The feature remains because `sd-tensor` links `mlx-c`
# only when it is on, so a `--no-default-features` build still compiles and
# links nothing — which is what keeps CI able to check the crate graph on a
# machine without MLX installed.
mlx = ["stable-diffusion-rs/mlx", "sd-tensor/mlx"]
