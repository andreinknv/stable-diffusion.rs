[workspace]
resolver = "2"
members = [
    "crates/sd-tensor",
    "crates/sd-loader",
    "crates/sd-models",
    "crates/sd-sample",
    "crates/stable-diffusion-rs",
    "crates/sd-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/andreinknv/stable-diffusion.rs"
homepage = "https://github.com/andreinknv/stable-diffusion.rs"
authors = ["stable-diffusion.rs contributors"]

[workspace.dependencies]

sd-tensor = { path = "crates/sd-tensor", version = "0.0.1" }
sd-loader = { path = "crates/sd-loader", version = "0.0.1" }
sd-models = { path = "crates/sd-models", version = "0.0.1" }
sd-sample = { path = "crates/sd-sample", version = "0.0.1" }
stable-diffusion-rs = { path = "crates/stable-diffusion-rs", version = "0.0.1" }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
safetensors = "0.6"
memmap2 = "0.9"

# Only for the vendored CLIP vocabulary, which is a JSON object of 49,408
# entries. Already compiled as part of `tokenizers`, so this adds a name
# rather than a build.
serde_json = "1"

# CLIP tokenization. default-features = false is deliberate: the default
# feature set pulls `onig`, which builds the oniguruma C library and would
# undo this project's "no C toolchain" property. The pure-Rust path is enough
# to load a tokenizer.json and encode.
#
# **`fancy-regex`, not `onig`.** A regex backend is mandatory, and onig is a C
# library — which would undo this project's "no C toolchain" property for the
# sake of loading a tokenizer.json. fancy-regex is pure Rust and does the job.
#
# It was implicit until candle went: candle pulled tokenizers with a backend
# already enabled, so nothing here had to name one. Removing candle made that
# a hard error at build time, which is the good direction — the dependency was
# always real and is now visible.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug builds of tensor code are unusably slow; optimize deps even in dev.
[profile.dev.package."*"]
opt-level = 3
