[workspace]
resolver = "2"
members = [
    "crates/sd-tensor",
    "crates/sd-loader",
    "crates/sd-models",
    "crates/sd-sample",
    "crates/stable-diffusion-rs",
    "crates/sd-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/andreinknv/stable-diffusion.rs"
homepage = "https://github.com/andreinknv/stable-diffusion.rs"
authors = ["stable-diffusion.rs contributors"]

[workspace.dependencies]
# Pinned exactly: candle is pre-1.0 and breaks between minor versions.
# Only sd-tensor may depend on these. See docs/seam.md.
candle-core = "=0.11.0"
candle-nn = "=0.11.0"

sd-tensor = { path = "crates/sd-tensor", version = "0.0.1" }
sd-loader = { path = "crates/sd-loader", version = "0.0.1" }
sd-models = { path = "crates/sd-models", version = "0.0.1" }
sd-sample = { path = "crates/sd-sample", version = "0.0.1" }
stable-diffusion-rs = { path = "crates/stable-diffusion-rs", version = "0.0.1" }

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
safetensors = "0.6"
memmap2 = "0.9"

# CLIP tokenization. default-features = false is deliberate: the default
# feature set pulls `onig`, which builds the oniguruma C library and would
# undo this project's "no C toolchain" property. The pure-Rust path is enough
# to load a tokenizer.json and encode.
#
# **Held at 0.22 to match candle, not through neglect.** candle-core 0.11.0
# depends on tokenizers 0.22 itself, so asking for 0.23 here does not upgrade
# anything — it compiles *both*, and 0.23 additionally makes a regex backend
# mandatory, adding `fancy-regex` to the tree. Measured before reverting: the
# 0.23 tokenizer produces byte-identical ids against the HuggingFace reference,
# so the whole trade was two copies of a large crate for no observable change.
# Revisit when candle moves.
tokenizers = { version = "0.22", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Debug builds of tensor code are unusably slow; optimize deps even in dev.
[profile.dev.package."*"]
opt-level = 3
