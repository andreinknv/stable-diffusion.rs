name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  seam:
    name: seam (candle confined to sd-tensor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-seam.sh

  native-deps:
    name: native deps (C/C++ budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fails if any crate outside the documented allowlist compiles C or C++.
      # A native dependency arrives transitively, in someone else's manifest,
      # and nothing about the build looks different when it does.
      - run: ./scripts/check-native-deps.sh
      - run: ./scripts/check-native-deps.sh cuda

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Golden-tensor tests skip themselves when reference data is absent.
      # CI runs the structural tests; numerical verification happens locally
      # against generated references. See xtask/golden/README.md.
      - run: cargo test --workspace

  metal:
    name: metal (build + device tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Nothing else in this file compiles the Metal backend, so a
      # Metal-only break — a cfg-gated branch that stops building, a
      # signature that changed under a feature flag — shipped undetected.
      # That is not hypothetical: every GPU defect found so far lived in
      # code no CI job touched.
      - name: build with metal
        run: cargo clippy --workspace --all-targets --features metal -- -D warnings
      # The device tests skip themselves when no Metal device is present, so
      # this is a compile gate first and a device gate only where the runner
      # provides one. Golden data is absent here, so the numerical tests skip
      # exactly as they do on the other jobs.
      - name: test with metal
        run: cargo test --workspace --features metal

  deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
