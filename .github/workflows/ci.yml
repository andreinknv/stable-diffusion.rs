name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  seam:
    name: seam (backend confined to sd-tensor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-seam.sh

  native-deps:
    name: native deps (C/C++ budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fails if any crate outside the documented allowlist compiles C or C++.
      # A native dependency arrives transitively, in someone else's manifest,
      # and nothing about the build looks different when it does.
      - run: ./scripts/check-native-deps.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Linux has no MLX, so it checks the half of the workspace that does not need
  # one: the tokenizers, the scalar schedules, and the name mappings. That is a
  # real check — those are shared code, and a break in them is a break
  # everywhere — but it is not the product.
  graph:
    name: crate graph (no backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo test --workspace --no-default-features

  # The real gate. `macos-latest` is Apple silicon, which is what MLX wants.
  mlx:
    name: mlx (build, lint, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # MLX is a system library, not a crate. `build.rs` finds it through
      # MLX_C_PREFIX/MLX_PREFIX or Homebrew and says so plainly when it cannot.
      - name: install mlx
        run: brew install mlx-c
      - run: cargo clippy --workspace --all-targets --features mlx -- -D warnings
      # The golden tests skip themselves when reference data is absent, so this
      # is a compile-and-structure gate here. Numerical verification runs
      # locally against generated references — see xtask/golden/README.md, and
      # note that SD_REQUIRE_FIXTURES turns those skips into failures where the
      # data does exist.
      - run: cargo test --workspace --features mlx

  deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
